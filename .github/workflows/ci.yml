name: OpenClinic CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Types
        run: pnpm --filter @openclinic/core build

      - name: Run Strict Typecheck
        run: pnpm run typecheck

      - name: Validate Compliance Catalog
        run: pnpm run compliance:catalog

      - name: Test Compliance Runner
        run: pnpm run compliance:test

      - name: Run Test Suite
        run: pnpm test

  migrations:
    uses: ./.github/workflows/migrations.yml

  agenda-readiness:
    name: Agenda specification readiness
    needs: [validate, migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/download-artifact@v4
        with:
          name: agenda-functional-results
          path: artifacts
      - name: Check documented requirements still awaiting acceptance
        run: pnpm run verify:agenda-readiness
